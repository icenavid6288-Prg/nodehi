<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>اتصال اینترنت برقرار نیست | نودهی</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f6f8fa;
        color: #1f2937;
        font-family: Vazirmatn, system-ui, Tahoma, sans-serif;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #fff;
        border: 1px solid #e5e9ef;
        border-radius: 20px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 8px 24px -12px rgba(15, 42, 67, 0.12);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: rgba(15, 42, 67, 0.08);
        color: #0f2a43;
        font-size: 24px;
        margin-bottom: 16px;
      }
      h1 { font-size: 18px; margin: 0 0 10px; }
      p { font-size: 13px; line-height: 2; color: #6b7280; margin: 0 0 20px; }
      button {
        border: 0;
        border-radius: 12px;
        background: #0f2a43;
        color: #fff;
        font-size: 14px;
        font-family: inherit;
        padding: 12px 24px;
        cursor: pointer;
      }
      button:hover { background: #1b4066; }
      .hint { margin-top: 18px; font-size: 11px; color: #9ca3af; }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge" aria-hidden="true">⌁</span>
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>
        صفحه‌هایی که قبلاً بازدید کرده‌اید ممکن است آفلاین در دسترس باشند، اما برای مشاهده قیمت‌های به‌روز و ثبت
        سفارش به اینترنت نیاز دارید.
      </p>
      <button type="button" onclick="location.reload()">تلاش مجدد</button>
      <p class="hint">سبد خرید و علاقه‌مندی‌های شما روی همین دستگاه ذخیره شده است.</p>
    </main>
  </body>
</html>
